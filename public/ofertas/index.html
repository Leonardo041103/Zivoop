<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zivoop Ofertas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14162B">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--ink:#14162B;--ink2:#4A4E6A;--soft:#7A7F9A;--paper:#F5F6FA;--card:#fff;--cobalt:#2E4BFF;--cobalt-d:#1F36D6;--tang:#FF7A1A;--mint:#19B37A;--red:#E5484D;--amber:#F2A33A;
  --zap:#E7FFDB;--zapbg:#EFE7DD;--line:rgba(20,22,43,.1);--line2:rgba(20,22,43,.18);--f:'Archivo',system-ui,sans-serif;--r:16px;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-stretch:118%;font-weight:850;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(24px,3.4vw,32px)}h2{font-size:19px}h3{font-size:16px}
.b{min-height:42px;padding:0 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.b.pri{background:var(--cobalt);color:#fff}.b.pri:hover:not(:disabled){background:var(--cobalt-d)}
.b.sec{background:var(--card);border:1px solid var(--line2);color:var(--ink)}.b.sec:hover{border-color:var(--ink2)}
.b.ok{background:var(--mint);color:#fff}.b.no{color:var(--red);border:1px solid rgba(229,72,77,.35);background:#fff}
.b.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:10px}.b.wide{width:100%}
input.t,select.t,textarea.t{width:100%;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font-size:15px}
textarea.t{min-height:90px;resize:vertical}input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--cobalt);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--ink2)}
.grid2{display:grid;gap:12px}@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;gap:12px}@media (min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)}}
.err{color:var(--red);font-size:14px;min-height:1em;margin:0}.muted{color:var(--soft)}.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:750;border-radius:999px;padding:3px 9px;background:rgba(20,22,43,.06);color:var(--ink2);white-space:nowrap}
.pill.ok{background:rgba(25,179,122,.12);color:#0e7c54}.pill.no{background:rgba(229,72,77,.1);color:#b32a2f}.pill.am{background:rgba(242,163,58,.16);color:#9a5a00}.pill.bl{background:rgba(46,75,255,.1);color:var(--cobalt-d)}
.pill.shopee{background:#FFE9E2;color:#C2410C}.pill.mercadolivre{background:#FFF6C2;color:#5c4a00}.pill.amazon{background:#E8EEF6;color:#1d2b3f}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:650;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:980px){.toast{bottom:28px}}

/* entrar */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -30px rgba(20,22,43,.35)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-stretch:125%;font-size:19px;letter-spacing:-.02em;color:inherit;text-decoration:none}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--mint);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.logo small{font-weight:650;font-stretch:100%;font-size:13px;opacity:.6;letter-spacing:0}
.seg{display:flex;background:rgba(20,22,43,.06);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:700;color:var(--ink2)}.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* casca */
.app{display:grid;min-height:100vh}
@media (min-width:980px){.app{grid-template-columns:236px 1fr}}
.side{background:var(--ink);color:#fff;padding:18px 12px;display:none;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh}
@media (min-width:980px){.side{display:flex}}
.side .logo{padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:rgba(255,255,255,.72);font-weight:650;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:19px;height:19px;flex:none}.nav .n{margin-left:auto;font-size:12px;background:var(--tang);color:#fff;border-radius:99px;padding:1px 7px}
.side .fim{margin-top:auto;font-size:13px;color:rgba(255,255,255,.6);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side .fim button{color:rgba(255,255,255,.8);text-align:left;font-weight:650}
main{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}@media (min-width:980px){main{padding-bottom:30px}}
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}
.top .logo{display:flex}@media (min-width:980px){.top .logo{display:none}}
.colar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:0 6px 0 12px;max-width:620px;margin-left:auto}
@media (min-width:980px){.colar{margin-left:0}}
.colar input{border:0;outline:0;flex:1;min-width:0;min-height:40px;background:none}
.colar svg{width:18px;height:18px;color:var(--soft);flex:none}
.wrap{max-width:1140px;margin:0 auto;padding:22px 16px}
.cab{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.cab p{margin:6px 0 0;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@media (min-width:980px){.tabbar{display:none}}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--soft);padding:6px 0;border-radius:10px}
.tabbar button svg{width:22px;height:22px}.tabbar button[aria-current="page"]{color:var(--cobalt)}
.tabbar .mais{position:fixed;inset:0;z-index:40;background:rgba(20,22,43,.4);display:flex;align-items:flex-end}
.folha{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.folha button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--paper);font-weight:700;text-align:left}.folha svg{width:20px;height:20px}

/* números do topo */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:13px;color:var(--ink2);font-weight:650}
.kpi b{font-size:clamp(22px,3vw,28px);font-weight:850;font-stretch:112%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:12.5px;color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grafico{width:100%;height:190px;display:block}
.vazio{text-align:center;padding:34px 16px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:10px}
.vazio b{color:var(--ink);font-size:16px}

/* listas */
.lista{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .th{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--paper);flex:none;border:1px solid var(--line)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--soft);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.item .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(20,22,43,.18);transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw[aria-checked="true"]{background:var(--mint)}.sw[aria-checked="true"]::after{left:21px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-size:12.5px;color:var(--soft);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.tb td{padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tb td.r,.tb th.r{text-align:right}
.rol{overflow-x:auto}
@media (max-width:600px){.tb .so-pc{display:none}.colar .lg{display:none}}@media (min-width:601px){.colar .cu{display:none}}

/* número e QR */
.num{display:grid;gap:14px}@media (min-width:760px){.num{grid-template-columns:1fr 260px}}
.qr{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;place-items:center;aspect-ratio:1}
.qr svg,.qr img{width:100%;height:auto}
ol.passos{margin:0;padding-left:20px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}

/* nova oferta: a prévia do WhatsApp é o destaque */
.nova{display:grid;gap:16px}@media (min-width:980px){.nova{grid-template-columns:1fr 360px;align-items:start}}
.zap{background:var(--zapbg);border-radius:20px;padding:18px 14px;position:sticky;top:76px;
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.zap .cab2{display:flex;align-items:center;gap:10px;margin:-4px 0 12px;font-size:13px;color:#54656F;font-weight:650}
.zap .cab2 i{width:30px;height:30px;border-radius:50%;background:#25D366;display:grid;place-items:center;color:#fff;font-style:normal}
.bolha{background:var(--zap);border-radius:4px 14px 14px 14px;padding:5px 5px 8px;max-width:300px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:14.2px;line-height:1.38;color:#111B21}
.bolha img{width:100%;border-radius:10px;display:block;aspect-ratio:1;object-fit:cover;background:#fff}
.bolha .txt{padding:6px 6px 0;white-space:pre-wrap;word-wrap:break-word}
.bolha .txt a{color:#027EB5}.bolha .hora{text-align:right;font-size:11px;color:#667781;padding:0 6px}
.quando{display:grid;gap:8px}@media (min-width:600px){.quando{grid-template-columns:repeat(3,1fr)}}
.op{border:1px solid var(--line2);border-radius:13px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;background:#fff}
.op b{font-size:14.5px}.op small{color:var(--soft);font-size:12.5px}
.op[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.vars{display:flex;gap:6px;flex-wrap:wrap}.vars button{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(46,75,255,.08);color:var(--cobalt-d)}
.aviso{background:rgba(242,163,58,.12);border:1px solid rgba(242,163,58,.35);border-radius:12px;padding:10px 12px;font-size:14px;color:#6b4300}
.faixa{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.faixa.vencida{background:var(--red)}
.carregando{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 30px 80px -20px rgba(20,22,43,.5)}
dialog::backdrop{background:rgba(20,22,43,.45)}
dialog .in{padding:20px;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>

<!-- entrar -->
<section class="auth" id="telaAuth" hidden>
  <form class="box" id="fAuth">
    <a class="logo" href="#"><i>Z</i><span>Zivoop <small>Ofertas</small></span></a>
    <div>
      <h1 style="font-size:26px">Suas ofertas postadas sozinhas nos grupos</h1>
      <p class="muted" style="margin:8px 0 0">Cole o link da Shopee, do Mercado Livre ou da Amazon. A gente posta em todos os seus grupos de WhatsApp no horário certo.</p>
    </div>
    <div class="seg" role="group"><button type="button" id="sEntrar" aria-pressed="true">Entrar</button><button type="button" id="sCriar" aria-pressed="false">Criar conta</button></div>
    <label class="f">E-mail<input class="t" id="aEmail" type="email" autocomplete="email" required></label>
    <label class="f">Senha<input class="t" id="aSenha" type="password" autocomplete="current-password" minlength="6" required></label>
    <p class="err" id="aErr"></p>
    <button class="b pri wide" id="aBtn">Entrar</button>
    <button type="button" class="muted small" id="aEsqueci">Esqueci a senha</button>
    <p class="small muted" id="aTeste" hidden style="margin:0">7 dias grátis, sem cartão.</p>
  </form>
</section>

<!-- painel -->
<div class="app" id="telaApp" hidden>
  <aside class="side">
    <a class="logo" href="#inicio"><i>Z</i><span>Zivoop <small>Ofertas</small></span></a>
    <nav id="navSide"></nav>
    <div class="fim"><span id="sideEmail"></span><button id="sair">Sair</button></div>
  </aside>
  <main>
    <div class="top">
      <a class="logo" href="#inicio"><i>Z</i></a>
      <form class="colar" id="fColar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <input id="colarIn" placeholder="Colar link do produto…" aria-label="Link do produto" inputmode="url">
        <button class="b pri sm"><span class="lg">Criar oferta</span><span class="cu">Criar</span></button>
      </form>
    </div>
    <div class="wrap" id="tela"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SB_URL = window.ZV_SB_URL || "https://phswqjkytnkukqpbtoqd.supabase.co";
const SB_KEY = window.ZV_SB_KEY || "sb_publishable_LUsJVly6aj88WTDxTFeT6A_VB5kqA-8";
const SUPORTE_WHATS = window.ZV_OFERTAS_SUPORTE || "";   // número que aparece em "Assinar" (ex.: 5511999999999)
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = v => (+v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const int = v => (+v || 0).toLocaleString("pt-BR");
const pct = v => (isFinite(v) ? v : 0).toLocaleString("pt-BR", { maximumFractionDigits: v > 0 && v < 1 ? 2 : 1 }) + "%";
const dataHora = d => new Date(d).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(",", " ·");
const diaSP = d => new Date(d).toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
let tT; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 3200); }
const ERROS = { limite_grupos: "Você chegou ao limite de grupos do seu plano. Desligue outro grupo ou mude de plano.", limite_numeros: "Você chegou ao limite de números do seu plano.",
  ja_enviado: "Essa oferta já foi enviada.", "Invalid login credentials": "E-mail ou senha errados.", "User already registered": "Esse e-mail já tem conta. Use Entrar." };
const erro = e => { const m = (e && (e.message || e.error_description || e.msg)) || String(e); for (const k in ERROS) if (m.includes(k)) return ERROS[k]; return m; };
const LOJAS = { shopee: "Shopee", mercadolivre: "Mercado Livre", amazon: "Amazon", outra: "Outra loja" };

const IC = {
  inicio: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  nova: '<path d="M12 5v14M5 12h14"/>',
  agenda: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  grupos: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  numeros: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/>',
  comissao: '<path d="M12 2v20M17 6.5c-1-1.5-3-2.5-5-2.5-3 0-5 1.5-5 3.8C7 13 17 10.5 17 16c0 2.3-2.2 4-5 4-2.2 0-4.2-1-5.2-2.6"/>',
  membros: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  mais: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- períodos ---------- */
const PER = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7", "Últimos 7 dias"], ["mes", "Mês atual"], ["mesant", "Mês anterior"], ["30", "Últimos 30 dias"]];
function periodo(k) {
  const hoje = new Date(diaSP(Date.now()) + "T00:00:00-03:00"), d = 86400000, agora = new Date();
  const ini = s => new Date(s + "T00:00:00-03:00"), [y, m] = diaSP(Date.now()).split("-").map(Number);
  if (k === "hoje") return [hoje, agora];
  if (k === "ontem") return [new Date(hoje - d), hoje];
  if (k === "7") return [new Date(hoje - 6 * d), agora];
  if (k === "30") return [new Date(hoje - 29 * d), agora];
  if (k === "mes") return [ini(`${y}-${String(m).padStart(2, "0")}-01`), agora];
  const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; return [ini(`${py}-${String(pm).padStart(2, "0")}-01`), ini(`${y}-${String(m).padStart(2, "0")}-01`)];
}
const chips = (id, atual) => `<div class="chips" id="${id}">${PER.map(([k, n]) => `<button data-p="${k}" aria-pressed="${k === atual}">${n}</button>`).join("")}</div>`;
function ligarChips(id, f) { $(id).onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); f(b.dataset.p); }; }
function dias(de, ate) { const out = []; for (let t = new Date(diaSP(de) + "T12:00:00-03:00"); t < ate; t = new Date(+t + 86400000)) out.push(diaSP(t)); return out.length ? out : [diaSP(de)]; }

function barras(pontos, cor = "var(--cobalt)") {
  const W = 640, H = 190, pb = 24, max = Math.max(1, ...pontos.map(p => p.v)), bw = W / pontos.length;
  const rot = pontos.length > 16 ? Math.ceil(pontos.length / 8) : 1;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Mensagens por dia">
    ${pontos.map((p, i) => { const h = (H - pb - 10) * p.v / max; return `<rect x="${i * bw + bw * .18}" y="${H - pb - h}" width="${bw * .64}" height="${Math.max(h, p.v ? 2 : 0)}" rx="3" fill="${cor}"><title>${p.r}: ${p.v}</title></rect>
      ${i % rot === 0 ? `<text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#7A7F9A">${p.r}</text>` : ""}`; }).join("")}
    <line x1="0" y1="${H - pb}" x2="${W}" y2="${H - pb}" stroke="rgba(20,22,43,.12)"/></svg>`;
}
function linha(pontos) {
  const W = 640, H = 190, pb = 24, vs = pontos.map(p => p.v), max = Math.max(...vs, 1), min = Math.min(...vs, max), amp = Math.max(1, max - min);
  const x = i => pontos.length === 1 ? W / 2 : 8 + i * (W - 16) / (pontos.length - 1), y = v => 12 + (H - pb - 24) * (1 - (v - min) / amp);
  const rot = Math.max(1, Math.ceil(pontos.length / 8)), d = pontos.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução de membros">
    <path d="${d} L${x(pontos.length - 1)} ${H - pb} L${x(0)} ${H - pb}Z" fill="rgba(25,179,122,.12)"/>
    <path d="${d}" fill="none" stroke="var(--mint)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${pontos.map((p, i) => `${i % rot === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#7A7F9A">${p.r}</text>` : ""}`).join("")}</svg>`;
}

/* ---------- conversa com o robô ---------- */
async function comando(tipo, numero_id, dados, espera = 60) {
  const { data, error } = await sb.from("fl_comandos").insert({ tipo, numero_id: numero_id || null, dados: dados || {} }).select().single();
  if (error) throw error;
  for (let i = 0; i < espera; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const r = await sb.from("fl_comandos").select("status,resposta").eq("id", data.id).single();
    if (r.data && r.data.status === "ok") return r.data.resposta || {};
    if (r.data && r.data.status === "erro") throw new Error((r.data.resposta && r.data.resposta.erro) || "Não deu certo.");
  }
  throw new Error("O robô não respondeu. Confira se ele está ligado no servidor.");
}

    $("ck").innerHTML = `<div class="kpi"><span>Comissão total</span><b>${brl(com)}</b><small>sem cancelados</small></div><div class="kpi"><span>Valor vendido</span><b>${brl(gmv)}</b></div>
      <div class="kpi"><span>Pedidos válidos</span><b>${int(ped.size)}</b><small>${conc} concluídos · ${pend} pendentes</small></div><div class="kpi"><span>Ticket médio</span><b>${brl(ped.size ? gmv / ped.size : 0)}</b></div>
      <div class="kpi"><span>Comissão média</span><b>${pct(gmv ? com / gmv * 100 : 0)}</b><small>do valor vendido</small></div><div class="kpi"><span>Taxa de aprovação</span><b>${pct(todos.size ? ped.size / todos.size * 100 : 0)}</b><small>pedidos que não foram cancelados</small></div>
      <div class="kpi"><span>Pedidos inválidos</span><b>${int(inval.size)}</b><small>cancelados ou não pagos</small></div><div class="kpi"><span>Comissão por pedido</span><b>${brl(ped.size ? com / ped.size : 0)}</b></div>`;
    const ST = { concluido: ["ok", "Concluído"], pendente: ["am", "Pendente"], cancelado: ["no", "Cancelado"], nao_pago: ["", "Não pago"] };
    $("cl").innerHTML = L.length ? `<table class="tb"><thead><tr><th>Data</th><th>Produto</th><th class="r">Valor</th><th class="r">Comissão</th><th>Status</th></tr></thead><tbody>${L.slice(0, 200).map(c => `<tr><td class="small">${dataHora(c.data)}</td><td>${esc(c.produto || "Pedido " + c.pedido)}</td><td class="r">${brl(c.valor)}</td><td class="r"><b>${brl(c.comissao)}</b></td><td><span class="pill ${ST[c.status][0]}">${ST[c.status][1]}</span></td></tr>`).join("")}</tbody></table>`
      : `<div class="vazio"><b>Nenhum pedido no período</b><span>${tem ? "Clique em Atualizar agora para buscar na Shopee." : "Cadastre a API da Shopee em Configurações."}</span></div>`;
  }
  carregar();
}

/* ---------- membros ---------- */
async function telaMembros() {
  const { data: gs } = await sb.from("fl_grupos").select("id,nome,membros").order("nome"); let per = "7", grupo = "";
  $("tela").innerHTML = `${faixaPlano()}<div class="cab"><div><h1>Membros</h1><p>Quantas pessoas entram e saem dos seus grupos.</p></div>
      <select class="t" id="mG" style="width:auto"><option value="">Todos os grupos</option>${(gs || []).map(g => `<option value="${g.id}">${esc(g.nome)}</option>`).join("")}</select></div>
    ${chips("mPer", per)}<div class="kpis" id="mk" style="margin-top:14px"></div>
    <div class="card" style="margin-top:14px"><h3>Evolução de membros</h3><div id="mg"></div></div>
    <div class="card rol" style="margin-top:14px"><div id="mt"></div></div>`;
  ligarChips("mPer", k => { per = k; carregar(); }); $("mG").onchange = () => { grupo = $("mG").value; carregar(); };
  async function carregar() {
    const [de, ate] = periodo(per); let q = sb.from("fl_membros_dia").select("*").gte("dia", diaSP(de)).lte("dia", diaSP(ate)); if (grupo) q = q.eq("grupo_id", grupo);
    const { data } = await q; const L = data || [], gsel = (gs || []).filter(g => !grupo || g.id === grupo);
    const ent = L.reduce((s, x) => s + x.entradas, 0), sai = L.reduce((s, x) => s + x.saidas, 0), total = gsel.reduce((s, g) => s + g.membros, 0);
    const porDia = {}; L.forEach(x => { const d = String(x.dia).slice(0, 10); porDia[d] = (porDia[d] || 0) + x.membros; });
    const ds = dias(de, ate), nd = Math.max(1, ds.length), churn = total ? sai / nd / total * 100 : 0;
    $("mk").innerHTML = `<div class="kpi"><span>Total de grupos</span><b>${gsel.length}</b></div><div class="kpi"><span>Total de participantes</span><b>${int(total)}</b></div>
      <div class="kpi"><span>Saldo do período</span><b style="color:${ent - sai >= 0 ? "var(--mint)" : "var(--red)"}">${ent - sai >= 0 ? "+" : ""}${int(ent - sai)}</b><small>${int(ent)} entraram · ${int(sai)} saíram</small></div>
      <div class="kpi"><span>Saída diária</span><b>${pct(churn)}</b><small>média de quem sai por dia</small></div>`;
    let ult = null; const pts = ds.map(d => { if (porDia[d] != null) ult = porDia[d]; return { r: d.slice(8) + "/" + d.slice(5, 7), v: ult }; }).filter(p => p.v != null);
    $("mg").innerHTML = pts.length > 1 ? linha(pts) : `<div class="vazio"><span>${pts.length ? "Hoje: <b>" + int(pts[0].v) + "</b> participantes. " : ""}O gráfico aparece a partir do segundo dia com o WhatsApp conectado.</span></div>`;
    const pg = {}; L.forEach(x => { const p = pg[x.grupo_id] = pg[x.grupo_id] || { e: 0, s: 0 }; p.e += x.entradas; p.s += x.saidas; });
    $("mt").innerHTML = gsel.length ? `<table class="tb"><thead><tr><th>Grupo</th><th class="r">Membros</th><th class="r">Entraram</th><th class="r">Saíram</th><th class="r">Saldo</th></tr></thead><tbody>
      ${gsel.map(g => { const p = pg[g.id] || { e: 0, s: 0 }; return `<tr><td>${esc(g.nome)}</td><td class="r">${int(g.membros)}</td><td class="r">${int(p.e)}</td><td class="r">${int(p.s)}</td><td class="r"><b>${p.e - p.s >= 0 ? "+" : ""}${int(p.e - p.s)}</b></td></tr>`; }).join("")}</tbody></table>`
      : `<div class="vazio"><b>Sem grupos ainda</b><a class="b sec sm" href="#numeros">Conectar número</a></div>`;
  }
  carregar();
}

/* ---------- configurações ---------- */
async function telaConfig() {
  const c = CONTA, ex = { loja: "shopee", titulo: "Fone Bluetooth com Estojo", preco_de: "159,90", preco_por: "79,90", cupom: "", link_afiliado: "https://s.shopee.com.br/exemplo", imagem: "" };
  $("tela").innerHTML = `${faixaPlano()}<div class="cab"><div><h1>Configurações</h1><p>Como as mensagens saem e as suas contas de afiliado.</p></div></div>
    <form id="fc" class="stack">
      <div class="nova"><div class="card stack"><h2>Modelo da mensagem</h2>
        <label class="f">Texto que vai em toda oferta<textarea class="t" id="cMod" style="min-height:170px">${esc(c.modelo)}</textarea></label>${varsHtml("cMod")}
        <p class="small muted" style="margin:0">Use *texto* para negrito e ~texto~ para riscado, como no WhatsApp. {de} só aparece quando a oferta tem preço antes.</p></div>
        <aside class="zap"><div class="cab2"><i>✓</i>Exemplo</div><div class="bolha" id="cPrev"></div></aside></div>
      <div class="card stack"><h2>Ritmo de envio</h2>
        <div class="grid2"><label class="f">Espera mínima entre um grupo e outro (segundos)<input class="t" id="cMin" type="number" min="5" value="${c.intervalo_min}"></label>
          <label class="f">Espera máxima (segundos)<input class="t" id="cMax" type="number" min="5" value="${c.intervalo_max}"></label></div>
        <p class="small muted" style="margin:0">Uma espera variada entre os grupos deixa o envio parecido com o de uma pessoa e reduz o risco de bloqueio.</p>
        <div class="grid3"><label class="f">Espaço entre ofertas da fila (minutos)<input class="t" id="cEsp" type="number" min="1" value="${c.espaco_fila}"></label>
          <label class="f">Fila começa às (hora)<input class="t" id="cIni" type="number" min="0" max="23" value="${c.janela_ini}"></label>
          <label class="f">Fila para às (hora)<input class="t" id="cFim" type="number" min="1" max="24" value="${c.janela_fim}"></label></div></div>
      <div class="card stack"><h2>Contas de afiliado</h2>
        <div class="grid2"><label class="f">Shopee: App ID<input class="t" id="cApp" value="${esc(c.shopee_app_id)}" autocomplete="off"></label>
          <label class="f">Shopee: Senha da API<input class="t" id="cSeg" type="password" value="${esc(c.shopee_segredo)}" autocomplete="new-password"></label></div>
        <p class="small muted" style="margin:0">Com a API da Shopee, a gente puxa nome, foto e preço do produto, gera seu link de afiliado e mostra as comissões. Pegue os dados no <a href="https://affiliate.shopee.com.br/open_api" target="_blank" rel="noopener">Portal de Afiliados</a>, menu Open API.</p>
        <label class="f">Amazon: seu ID de associado (tag)<input class="t" id="cAmz" placeholder="seunome-20" value="${esc(c.amazon_tag)}"></label>
        <p class="small muted" style="margin:0">No Mercado Livre, cole o link que você gerou no programa de afiliados. Ele vai como está.</p></div>
      <div class="card stack"><h2>Seu nome</h2><label class="f">Como você quer ser chamado<input class="t" id="cNome" value="${esc(c.nome)}"></label>
        <p class="small muted" style="margin:0">Plano: <b>${c.plano === "teste" ? "Teste grátis" : esc(c.plano)}</b> · vale até ${new Date(c.ativo_ate).toLocaleDateString("pt-BR")} · até ${c.limite_numeros} números, ${c.limite_grupos} grupos e ${c.limite_dia} mensagens por número por dia.</p></div>
      <p class="err" id="cErr"></p><div><button class="b pri">Salvar configurações</button></div>
    </form>`;
  const prev = () => previa("cPrev", ex, $("cMod").value); prev(); $("cMod").oninput = prev;
  document.querySelectorAll(".vars [data-v]").forEach(b => b.onclick = () => inserirVar(b));
  $("fc").onsubmit = async e => { e.preventDefault(); $("cErr").textContent = "";
    const v = { nome: $("cNome").value.trim(), modelo: $("cMod").value, intervalo_min: +$("cMin").value, intervalo_max: +$("cMax").value, espaco_fila: +$("cEsp").value, janela_ini: +$("cIni").value, janela_fim: +$("cFim").value,
      shopee_app_id: $("cApp").value.trim(), shopee_segredo: $("cSeg").value.trim(), amazon_tag: $("cAmz").value.trim() };
    if (!v.modelo.includes("{link}")) { $("cErr").textContent = "O modelo precisa ter {link}, senão a mensagem vai sem o link do produto."; return; }
    if (v.intervalo_min < 5 || v.intervalo_max < v.intervalo_min) { $("cErr").textContent = "A espera mínima é 5 segundos, e a máxima não pode ser menor que a mínima."; return; }
    if (v.janela_fim <= v.janela_ini) { $("cErr").textContent = "A hora de parar precisa ser depois da hora de começar."; return; }
    const r = await sb.from("fl_contas").update(v).eq("dono", USER.id).select().single(); if (r.error) { $("cErr").textContent = erro(r.error); return; }
    CONTA = r.data; toast("Configurações salvas."); };
}

sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { const p = prompt("Nova senha (mínimo 6 caracteres):"); if (p) sb.auth.updateUser({ password: p }).then(r => toast(r.error ? erro(r.error) : "Senha trocada.")); } });
abrir();
</script>
</body>
</html>
